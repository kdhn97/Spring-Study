# \uC560\uD50C\uB9AC\uCF00\uC774\uC158 \uC774\uB984 \uC124\uC815
spring.application.name=TestSecurity

# MySQL \uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uC5F0\uACB0 \uC124\uC815
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# \uB370\uC774\uD130\uBCA0\uC774\uC2A4 URL \uC124\uC815
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/test?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
# \uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uC811\uC18D \uACC4\uC815 \uC815\uBCF4
spring.datasource.username=test
spring.datasource.password=1234

# JPA \uC124\uC815 - none: \uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uC2A4\uD0A4\uB9C8 \uC790\uB3D9 \uC0DD\uC131/\uC218\uC815\uD558\uC9C0 \uC54A\uC74C
spring.jpa.hibernate.ddl-auto=none

# \uBB3C\uB9AC\uC801 \uD14C\uC774\uBE14 \uBA85\uBA85 \uC804\uB7B5 \uC124\uC815
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# \uC138\uC158 \uD0C0\uC784\uC544\uC6C3 \uC124\uC815 (90\uBD84)
server.servlet.session.timeout=90m